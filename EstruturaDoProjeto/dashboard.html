<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guigstrak - Dashboard</title>

    <link rel="stylesheet" href="/EstruturaDoProjeto/CSS/dashboardaluno.css">
</head>

<body>

    <main class="dashboard">

        <!-- CABEÇALHO -->

        <header>

            <div class="title">
                <h1>Guigstrak</h1>
                <p>Dashboard</p>
            </div>

            <!-- PERFIL -->

            <div class="profile">

                <button class="avatar" id="profileBtn">
                    G
                </button>

                <div class="user">
                    <strong>Aluno</strong>
                    <small>Bem-vindo!</small>
                </div>

                <!-- MENU DO PERFIL -->

                <div class="profile-menu" id="profileMenu">

                    <button id="changeAccount">
                        <span>↔</span>
                        Trocar de conta
                    </button>

                    <button id="logout">
                        <span>↪</span>
                        Sair
                    </button>

                </div>

            </div>

        </header>


        <!-- RESUMO -->

        <section class="summary">

            <div class="card">

                <p>Média geral</p>

                <strong>7,4</strong>

            </div>


            <div class="card">

                <p>Frequência</p>

                <strong>91%</strong>

            </div>


            <div class="card">

                <p>Situação</p>

                <strong class="regular">
                     Regular
                </strong>

            </div>

        </section>


        <!-- CONTEÚDO -->

        <section class="content">

            <!-- NOTAS -->

            <div class="box">

                <h2>Minhas notas</h2>

                <div class="nota">
                    <span>Matemática</span>
                    <strong>7,0</strong>
                </div>

                <div class="nota">
                    <span>Física</span>
                    <strong>8,0</strong>
                </div>

                <div class="nota">
                    <span>Programação</span>
                    <strong>8,6</strong>
                </div>

                <div class="nota">
                    <span>Banco de Dados</span>
                    <strong>6,8</strong>
                </div>

            </div>


            <!-- ALERTAS -->

            <div class="box">

                <h2>Alertas</h2>

                <div class="alert">

                

                    <div>
                        <strong>Nenhum alerta</strong>

                        <p>
                            Nenhum alerta acadêmico.
                        </p>
                    </div>

                </div>

            </div>

        </section>


        <!-- RESUMO FINAL -->

        <section class="box final">

            <h2>Resumo</h2>

            <p>
                Seu desempenho está regular.
            </p>

        </section>

    </main>


    <script src="/EstruturaDoProjeto/JS/dashboardaluno.js"></script>

</body>

</html>
