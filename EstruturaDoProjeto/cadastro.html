<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guigstrack</title>
    <link rel="stylesheet" href="../EstruturaDoProjeto/CSS/cadastro.css">
    <script src="../EstruturaDoProjeto/JS/cadastro.js" defer></script>
</head>

<body>

    <h1>Cadastro Guigstrack</h1>

    <div>
        <h2>Preencha as informações: </h2>

        <label for="Nome">Seu Nome: </label><br>
        <input type="text" name="Nome" id="Nome"><br><BR></BR>

        <label for="email">Seu E-mail: </label><br>
        <input type="text" name="email" id="email"><br><BR></BR>

        <label for="senha">Informe sua senha: </label><br>
        <input type="text" name="senha" id="senha"><br><BR></BR>

        <label for="confirmarSE">Confirme sua senha: </label><br>
        <input type="text" name="confirmarSE" id="confirmarSE"><br><BR></BR>

        <label for="tipoDeUsuario">Informe seu tipo de usuário: </label>
        <select name="selecaoDeusuarios" id="selecaoDeusuarios">
            <option value="professor">Professor</option>
            <option value="aluno">Aluno</option>
            <option value="coordenador">Coordenador</option>
        </select><br><BR></BR>

        <div id="coordenador"></div>
        <div id="professor"></div>
        <div id="aluno"></div>

        <button type="submit">Enviar</button>
    </div>


</body>

</html>
